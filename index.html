<style>

.pick:active{transform:scale(.94)}
.pick[aria-pressed=true]{border-color:var(--mc);background:linear-gradient(160deg,color-mix(in srgb,var(--mc) 52%,transparent),color-mix(in srgb,var(--mc) 20%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 2px color-mix(in srgb,var(--mc) 55%,transparent),0 4px 14px color-mix(in srgb,var(--mc) 35%,transparent)}

dialog .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}dialog .row .btn{width:100%;padding:0 8px}

<div id="app">
  <header class="top"><div class="logo" aria-hidden="true"><i>0</i><i>7</i><i>6</i></div><h1 id="ttl">Zählwerk</h1></header>
  <main id="view"></main>
</div>
<nav id="tabs" aria-label="Hauptnavigation"><div>
  <button data-act="go" data-v="home"></button><button data-act="go" data-v="read"></button><button data-act="go" data-v="hist"></button><button data-act="go" data-v="set"></button>
</div></nav>

<div id="upd" hidden><span>Neue Version bereit.</span><button class="btn sm" data-act="reload">Neu laden</button></div>
<input id="fcam" type="file" accept="image/*" capture="environment" hidden>
<input id="flib" type="file" accept="image/*" hidden>
<input id="fimp" type="file" accept="application/json,.json" hidden>
<input id="fcsv" type="file" accept=".csv,.txt,text/csv,text/plain" hidden>

<script>
'use strict';
const APP={name:'Zählwerk',version:'0.3.3'};
const DAY=864e5;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const p2=n=>String(n).padStart(2,'0');

// <logic>
const nf=(x,d)=>Number(x).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const dshort=t=>new Date(t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const num=s=>{const x=parseFloat(String(s==null?'':s).replace(',','.'));return isFinite(x)?x:null};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

// Zählerstand als Text ("02852,659") -> Ziffernschema und Wert
function parseValueString(s){
 s=String(s==null?'':s).trim().replace(/\s+/g,'');
 const m=s.match(/^(\d+)(?:[.,](\d+))?$/); if(!m) return null;
 const dec=(m[2]||'').length;
 return {pre:m[1].length,dec,value:parseFloat(m[1]+(dec?'.'+m[2]:''))};
}
function digitString(v,pre,dec){const [a,b='']=Number(v).toFixed(dec).split('.');return a.padStart(pre,'0')+b}
function fmtValue(v,pre,dec){const d=digitString(v,pre,dec);return dec?d.slice(0,pre)+','+d.slice(pre):d}
function valueFromDigits(d,pre,dec){return parseFloat(d.slice(0,pre)+(dec?'.'+d.slice(pre):''))}

// Erkannten Text (z. B. "Text aus Kamera") bereinigen
const CONF={O:'0',o:'0',Q:'0',D:'0','б':'6','Б':'6',l:'1',I:'1','|':'1','!':'1',S:'5',s:'5',B:'8',Z:'2','З':'3','з':'3'};
const DIGITISH=/^[0-9OoQDбБlI|!SsBZЗз\s.,\-_–—:]+$/;
const stripUnit=l=>l.replace(/\s*(m3|m³|m|kwh)\s*$/i,'');
function toDigits(s){let o='';for(const ch of s){if(ch>='0'&&ch<='9')o+=ch;else if(CONF[ch]!==undefined)o+=CONF[ch]}return o}
function scanCandidates(text){
 const out=[];let buf=[];
 const flush=()=>{if(buf.length){const raw=buf.join(' '),d=toDigits(raw);if(d.length>=3)out.push({raw,digits:d});buf=[]}};
 String(text||'').split(/\r?\n/).forEach(line=>{
  const l=stripUnit(line.trim());
  if(!l)return;
  if(l.length<=16&&DIGITISH.test(l)&&/[0-9OoQDбБlI|!SsBZЗз]/.test(l))buf.push(l);else flush();
 });
 flush();return out;
}
function pickScan(text,sch,last,exclude){
 const N=sch.pre+sch.dec,ex=(exclude||[]).map(x=>String(x).replace(/\D/g,'')).filter(Boolean);
 const cands=scanCandidates(text).filter(c=>!ex.includes(c.digits));
 if(!cands.length)return {kind:null,msg:'Im Text wurden keine Ziffernfolgen gefunden, die wie ein Zählerstand aussehen.'};
 let good=null,odd=null;
 for(const c of cands){

function intervalsOf(rs){

  if(v<prev.v)w.push({k:'low',text:'Der Stand ist niedriger als der letzte ('+nf(prev.v,d)+' am '+dshort(prev.t)+').'});
  else{
   if(v===prev.v&&days>20)w.push({k:'same',text:'Der Stand ist seit '+Math.round(days)+' Tagen unverändert.'});
   const rates=intervalsOf(s.filter(r=>r.t<=prev.t)).filter(x=>!x.est&&x.days>=5).slice(-3).map(x=>x.rate);
   if(days>=3&&rates.length>=3){
    const a=avg(rates),r=(v-prev.v)/days;
    if(a>0&&r>a*4)w.push({k:'high',text:'Verbrauch pro Tag: '+nf(r,2)+'. In den letzten Zeiträumen waren es im Schnitt '+nf(a,2)+'. Das fällt auf, bitte prüfe die Stellen. (Im Herbst und Frühjahr ist ein Sprung beim Heizen normal.)'});

   }

 }

const CR={img:null,src:null,rot:0,rect:{x:.1,y:.38,w:.8,h:.2},drag:null,cv:null,url:null,prevUrl:null};
function crReset(){
 if(CR.url)URL.revokeObjectURL(CR.url);if(CR.prevUrl)URL.revokeObjectURL(CR.prevUrl);

}
function crRotate(){

function crDraw(){

 const dpr=window.devicePixelRatio||1,W=cv.clientWidth||320,H=Math.round(W*CR.src.height/CR.src.width);
 cv.style.height=H+'px';
 if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
 const g=cv.getContext('2d'),acc=getComputedStyle(document.documentElement).getPropertyValue('--pri').trim()||'#54D6A0';
 g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);g.drawImage(CR.src,0,0,W,H);
 const r=CR.rect,x=r.x*W,y=r.y*H,w=r.w*W,h=r.h*H;
 g.fillStyle='rgba(0,0,0,.55)';g.beginPath();g.rect(0,0,W,H);g.rect(x,y,w,h);g.fill('evenodd');
 g.strokeStyle=acc;g.lineWidth=2;g.strokeRect(x,y,w,h);g.fillStyle=acc;
 for(const [cx,cy] of [[x,y],[x+w,y],[x,y+h],[x+w,y+h]]){g.beginPath();g.arc(cx,cy,10,0,7);g.fill()}
}
function crBind(cv){
 CR.cv=cv;cv.style.touchAction='none';
 const pos=e=>{const b=cv.getBoundingClientRect();return {x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height,W:b.width,H:b.height}};
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 cv.onpointerdown=e=>{
  const p=pos(e),r=CR.rect,hit=(cx,cy)=>Math.hypot((p.x-cx)*p.W,(p.y-cy)*p.H)<30;let mode;
  if(hit(r.x,r.y))mode='nw';else if(hit(r.x+r.w,r.y))mode='ne';else if(hit(r.x,r.y+r.h))mode='sw';else if(hit(r.x+r.w,r.y+r.h))mode='se';
  else if(p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h)mode='move';else mode='new';
  CR.drag={mode,sx:p.x,sy:p.y,r:{...r}};

  e.preventDefault();

 cv.onpointermove=e=>{
  const d=CR.drag;if(!d)return;const p=pos(e),o=d.r,dx=p.x-d.sx,dy=p.y-d.sy;let x,y,w,h;
  if(d.mode==='move'){x=clamp(o.x+dx,0,1-o.w);y=clamp(o.y+dy,0,1-o.h);w=o.w;h=o.h}
  else{
   let x1=o.x,y1=o.y,x2=o.x+o.w,y2=o.y+o.h;
   if(d.mode==='new'){x1=d.sx;y1=d.sy;x2=p.x;y2=p.y}
   else{if(d.mode[1]==='w')x1=o.x+dx;else x2=o.x+o.w+dx;if(d.mode[0]==='n')y1=o.y+dy;else y2=o.y+o.h+dy}
   x1=clamp(x1,0,1);x2=clamp(x2,0,1);y1=clamp(y1,0,1);y2=clamp(y2,0,1);
   x=Math.min(x1,x2);y=Math.min(y1,y2);w=Math.abs(x2-x1);h=Math.abs(y2-y1);

function crRender(maxW){

const withTimeout=(p,ms,msg)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);

async function handlePhoto(file){
 if(!file)return;
 busy(true,'Foto wird geladen …');
 let stage='lesen',url=null;
 try{
  let meta=null;
  try{meta=exifTime(await file.slice(0,262144).arrayBuffer())}catch(e){}
  meta=meta||fnDate(file.name);
  const when=meta||file.lastModified||0;
  stage='öffnen';
  url=URL.createObjectURL(file);
  const img=await withTimeout(new Promise((ok,err)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>err(new Error('Das Foto konnte nicht geladen werden.'));i.src=url}),30000,'Das Foto lädt zu lange. Bitte ein anderes Foto wählen.');
  stage='verkleinern';
  const max=1800,k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  img.src='';
  crReset();CR.src=c;CR.rot=0;
  const mm=VIEW==='read'?curMeter():null;
  CR.rect=(mm&&mm.crop)?{...mm.crop}:{x:.1,y:.38,w:.8,h:.2};
  if(when&&when<Date.now()+60000){
   const t=toLocalInput(when);
   if(VIEW==='setup')W.dt=t;else{R.dt=t;R.photoNote=meta?'Datum und Uhrzeit stammen aus dem Foto.':''}
  }
  render();
 }catch(e){toast('Foto ('+stage+'): '+(e.message||'Fehler'))}
 finally{if(url)URL.revokeObjectURL(url);busy(false)}
}
async function pastePhoto(){
 try{
  if(!(navigator.clipboard&&navigator.clipboard.read))throw new Error('Das Einfügen von Fotos wird hier nicht unterstützt.');
  const items=await navigator.clipboard.read();
  for(const it of items){
   const type=it.types.find(t=>t.startsWith('image/'));
   if(type){const blob=await it.getType(type);await handlePhoto(new File([blob],'zwischenablage.'+(type.split('/')[1]||'png'),{type}));return}
  }
  toast('In der Zwischenablage liegt kein Foto. Kopiere es zuerst in der Fotos-App.');
 }catch(e){toast(e&&e.name==='NotAllowedError'?'Einfügen wurde nicht erlaubt.':(e.message||'Einfügen nicht möglich.'))}
}

function spark(vals){

 return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="var(--mc)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

let DUE=new Set();

async function importCsv(f){if(!f)return;try{await importCsvText(await f.text())}catch(e){toast(e.message||'Die Datei ist nicht lesbar.')}}
function exportCsv(){
 const blob=new Blob([buildCsv(S.meters,S.readings)],{type:'text/csv'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='zaehlwerk-ablesungen-'+new Date().toISOString().slice(0,10)+'.csv';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
 toast('CSV-Datei wurde erstellt.');
}
async function wipe(){
 const a=await modal('<h3>Alle Daten löschen?</h3><p>Zähler, Ablesungen und Fotos werden von diesem Gerät entfernt. Das lässt sich nicht rückgängig machen. Erstelle vorher eine Sicherung.</p><div class="row"><button class="btn danger" data-val="yes">Alles löschen</button><button class="btn sec" data-val="no">Abbrechen</button></div>');
 if(a!=='yes')return;
 S.readings.forEach(r=>{if(r.photo)DB.del(r.photo)});S=blank();save();startSetup(true);toast('Alle Daten wurden gelöscht.');
}

/* ---------- Einrichtungsassistent ---------- */
function pickColor(medium){
 const used=S.meters.map(m=>m.col),pref=MEDIA[medium].col;
 if(!used.includes(pref))return pref;
 return ['garten','himmel','cyan','gruen','waerme','sand','misc'].find(c=>!used.includes(c))||pref;
}
function uniqueName(base){
 if(!S.meters.some(m=>m.name===base))return base;
 let n=2;while(S.meters.some(m=>m.name===base+' '+n))n++;return base+' '+n;
}
function startSetup(first){
 const f=!!first&&!S.meters.length;
 const used=new Set(S.meters.map(m=>m.medium)),firstFree=Object.keys(MEDIA).find(k=>!used.has(k))||'gas';
 W={first:f,step:f?'welcome':'medium',medium:firstFree,name:'',unit:'',number:'',col:'',pre:5,dec:3,digits:[],dt:toLocalInput(Date.now()),nums:[]};
 crReset();VIEW='setup';render();window.scrollTo(0,0);
}
const STEPS=['medium','id','photo','value'];
function wDefaults(){
 W.name=uniqueName(MEDIA[W.medium].label);W.unit=MEDIA[W.medium].unit;W.col=pickColor(W.medium);W.pre=MEDIA[W.medium].pre;W.dec=MEDIA[W.medium].dec;W.digits=[];
}
function wCollect(){
 if(W.step==='id'){
  W.name=($('#wname')||{}).value||W.name;W.number=(($('#wnum')||{}).value||'').trim();
  if(W.medium==='sonst'&&$('#wunit'))W.unit=$('#wunit').value.trim();
 }
 if(W.step==='value'){W.dt=($('#wdt')||{}).value||W.dt}
}
function wBar(){const i=Math.max(0,STEPS.indexOf(W.step));return '<div class="steps" aria-label="Schritt '+(i+1)+' von '+STEPS.length+'">'+STEPS.map((s,k)=>'<i class="'+(k<=i?'on':'')+'"></i>').join('')+'</div>'}
function viewSetup(){
 if(!W)startSetup(false);
 const nav=(back,next,nl)=>'<div class="row">'+(back?'<button class="btn sec" data-act="wBack">Zurück</button>':'')+'<button class="btn" style="flex:1" data-act="'+next+'">'+(nl||'Weiter')+'</button></div>';
 if(W.step==='welcome')return '<div class="hero"><div class="logo" aria-hidden="true"><i>0</i><i>7</i><i>6</i></div><h2 style="font-size:24px">Willkommen bei Zählwerk</h2><p class="mu">Zählerstände erfassen, prüfen und auswerten. Die App startet leer. Richte jetzt deinen ersten Zähler ein, das dauert etwa eine Minute.</p></div>'+
  '<div class="row" style="justify-content:center"><button class="btn" data-act="wStart">Los geht’s</button></div><div class="row" style="justify-content:center"><button class="btn ghost" data-act="importData">Sicherung laden</button></div>';
 if(W.step==='medium'){
  if(!W.name)wDefaults();
  const cnt=k=>S.meters.filter(m=>m.medium===k).length;
  const tiles=Object.entries(MEDIA).map(([k,m])=>{const c=cnt(k);return '<button class="kind'+(c?' have':'')+'" data-act="wMedium" data-k="'+k+'" aria-pressed="'+(W.medium===k)+'" aria-label="'+m.label+(c?', schon '+c+' angelegt':'')+'" style="--mc:var(--c-'+m.col+')">'+(c?'<span class="badge">'+c+'</span>':'')+ico(m.icon)+'<span>'+m.label+'</span></button>'}).join('');
  return wBar()+'<h2 class="sect">Was möchtest du erfassen?</h2><div class="kinds">'+tiles+'</div>'+
   (S.meters.length?'<p class="mu sm" style="margin:2px 2px 12px">Abgeblendete Arten hast du schon, die Zahl zeigt wie viele. Du kannst trotzdem einen weiteren Zähler derselben Art anlegen.</p>':'')+
   '<div class="row">'+(S.meters.length?'<button class="btn sec" data-act="wCancel">Abbrechen</button>':(W.first?'<button class="btn sec" data-act="wBack">Zurück</button>':''))+'<button class="btn" style="flex:1" data-act="wNext">Weiter</button></div>';
 }
 if(W.step==='id'){
  const cands=W.nums.length?'<div class="chips">'+W.nums.map(c=>'<button class="chip" data-act="wNumPick" data-n="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>':'';
  return wBar()+'<section class="card"><h2>Name, Farbe und Zählernummer</h2>'+
   '<label class="fld">Name<input id="wname" value="'+esc(W.name)+'" autocomplete="off"></label>'+
   '<div class="fld" style="margin-bottom:0">Farbe</div><div class="swatches">'+COLS.map(c=>'<button class="sw" data-act="wColor" data-c="'+c+'" aria-label="Farbe '+COL_NAMES[c]+'" aria-pressed="'+(c===W.col)+'" style="--mc:var(--c-'+c+')"></button>').join('')+'</div>'+
   (W.medium==='sonst'?'<label class="fld">Einheit<input id="wunit" value="'+esc(W.unit)+'" autocomplete="off" placeholder="z. B. m³ oder kWh"></label>':'')+
   '<label class="fld">Zählernummer<input id="wnum" value="'+esc(W.number)+'" autocomplete="off" autocapitalize="characters"></label>'+
   '<p class="mu sm">Die Nummer steht auf dem Zähler und auf deiner Rechnung. Du tippst sie einmal ab. Sie hilft später, einen Zählerwechsel zu erkennen.</p>'+
   '<details class="help"><summary>Optional: Nummer aus kopiertem Text übernehmen</summary><p class="sm mu">Hast du den Text vom Typenschild kopiert, zum Beispiel in der Fotos-App (Ziffern lange drücken, Kopieren), füge ihn hier ein. Die App zeigt dann die passenden Nummern zum Antippen. Das geht nicht auf jedem Gerät, Abtippen funktioniert immer.</p><label class="fld">Eingefügter Text<textarea id="wscan" rows="3" autocomplete="off"></textarea></label>'+cands+'</details></section>'+nav(true,'wNext');
 }
 if(W.step==='photo'){
  return wBar()+'<section class="card"><h2>Foto vom Zähler</h2><p class="mu sm">Optional. Markiere einmal, wo der Zählerstand steht. Die App merkt sich den Ausschnitt für die nächsten Ablesungen.</p>'+(CR.src?photoEditor():photoPicker())+'</section>'+
   '<div class="row"><button class="btn sec" data-act="wBack">Zurück</button><button class="btn" style="flex:1" data-act="wNext">'+(CR.src?'Weiter':'Ohne Foto weiter')+'</button></div>';
 }
 return wBar()+'<section class="card"><h2>Erster Zählerstand</h2>'+
  '<p class="mu sm">Lies die Anzeige so ab, wie sie auf dem Zähler steht: erst die schwarzen Ziffern, dann die roten. Ein Komma musst du nicht eintippen, es steht schon da.</p>'+
  stepper('pre','Ziffern vor dem Komma (schwarz)',W.pre)+stepper('dec','Ziffern nach dem Komma (rot)',W.dec)+
  '<div class="entry">'+(CR.src?'<img id="cropimg" class="cropimg" alt="Ausschnitt mit dem Zählerstand">':'')+'<div class="rollers">'+rollerInputs(W.pre,W.dec,W.digits)+'</div><div id="wsum" class="msg">'+esc(wSum())+'</div></div>'+
  '<p class="mu sm">Die kleinen Zeigerräder zählen nicht, nur die Rollen mit Ziffern.</p>'+
  '<label class="fld">Stand vom<input type="datetime-local" id="wdt" value="'+esc(W.dt)+'"></label></section>'+
  '<div class="row"><button class="btn sec" data-act="wBack">Zurück</button><button class="btn" style="flex:1" data-act="wFinish">Zähler anlegen</button></div>';
}
function stepper(f,label,v){return '<div class="stepper"><span>'+label+'</span><div><button class="btn sec sm" data-act="wStep" data-f="'+f+'" data-d="-1" aria-label="weniger">−</button><b>'+v+'</b><button class="btn sec sm" data-act="wStep" data-f="'+f+'" data-d="1" aria-label="mehr">+</button></div></div>'}
function wSum(){const N=W.pre+W.dec,ds=Array.from({length:N},(_,i)=>W.digits[i]||'');if(ds.some(x=>x===''))return '';return 'Dein Stand: '+fmtValue(valueFromDigits(ds.join(''),W.pre,W.dec),W.pre,W.dec)+(W.unit?' '+W.unit:'')}
async function wFinish(){
 wCollect();
 const N=W.pre+W.dec,ds=Array.from({length:N},(_,i)=>W.digits[i]||''),t=new Date(W.dt).getTime();
 if(ds.some(x=>x===''))return toast('Bitte alle Stellen des Zählerstands eintragen.');
 if(!isFinite(t))return toast('Bitte Datum und Uhrzeit prüfen.');
 const p={pre:W.pre,dec:W.dec,value:valueFromDigits(ds.join(''),W.pre,W.dec)};
 const m={id:uid(),medium:W.medium,name:W.name.trim()||MEDIA[W.medium].label,unit:W.unit,number:W.number,col:W.col,pre:p.pre,dec:p.dec,created:Date.now()};
 if(CR.src)m.crop={...CR.rect};
 const id=uid(),rd={id,m:m.id,t,v:p.value};
 if(CR.src){const blob=await crBlob();if(blob&&await DB.put(id,blob))rd.photo=id}
 const first=!S.meters.length;
 S.meters.push(m);S.readings.push(rd);
 if(!save())return;
 crReset();R.mid=m.id;rDigits();
 const more=await modal('<h3>„'+esc(m.name)+'“ ist eingerichtet</h3><p class="mu sm" style="margin-bottom:4px">Erster Zählerstand:</p><div style="margin:6px 0 4px">'+rollers(fmtValue(p.value,p.pre,p.dec))+' <span class="mu sm">'+esc(m.unit)+'</span></div><p class="mu sm">Vom '+fmtFull(t)+'. Die roten Ziffern sind die Nachkommastellen.</p><p>Möchtest du einen weiteren Zähler anlegen?</p><div class="row"><button class="btn" data-val="more">Weiteren Zähler anlegen</button><button class="btn sec" data-val="done">Fertig</button></div>');
 W=null;
 if(more==='more')startSetup(false);else go('home');
}

/* ---------- Ereignisse ---------- */
const ACT={
 go:el=>{if(el.dataset.v==='set')SETP='main';go(el.dataset.v)},
 goData:()=>{SETP='data';go('set')},
 setPage:el=>{SETP=el.dataset.p;render();window.scrollTo(0,0)},
 emStep:el=>{if(!EM)return;const f=el.dataset.f,d=+el.dataset.d;if(f==='pre')EM.pre=Math.max(EM.reint?1:EM.minPre,Math.min(10,EM.pre+d));else EM.dec=Math.max(0,Math.min(5,EM.dec+d));emLive()},
 addRem:()=>editRem(null),
 editRem:el=>editRem(el.dataset.id),
 exportIcs:()=>exportIcs(),
 addMeter:()=>startSetup(false),
 readMeter:el=>{R.mid=el.dataset.id;rDigits();R.dt='';R.photoNote='';go('read')},
 pickMeter:el=>{R.mid=el.dataset.id;rDigits();render()},
 pickHist:el=>{H.mid=el.dataset.id;render()},
 camera:()=>$('#fcam').click(),
 library:()=>$('#flib').click(),
 pastePhoto:()=>pastePhoto(),
 rotate:()=>{if(!CR.src)return;crRotate();CR.rect={x:.1,y:.38,w:.8,h:.2};render()},
 newPhoto:()=>{crReset();render()},
 dropPhoto:()=>{crReset();R.photoNote='';render()},
 scanApply:()=>applyScan(),
 saveReading:()=>saveReading(),
 editReading:el=>editReading(el.dataset.id),
 editMeter:el=>editMeter(el.dataset.id),
 exportData:()=>exportData(),
 importData:()=>$('#fimp').click(),
 importCsv:()=>$('#fcsv').click(),
 exportCsv:()=>exportCsv(),
 wipe:()=>wipe(),
 wStart:()=>{W.step='medium';render()},
 wMedium:el=>{W.medium=el.dataset.k;wDefaults();render()},
 wNext:()=>{wCollect();const i=STEPS.indexOf(W.step);
  if(W.step==='id'&&!W.name.trim())return toast('Bitte einen Namen eingeben.');
  W.step=STEPS[Math.min(i+1,STEPS.length-1)];render();window.scrollTo(0,0)},
 wBack:()=>{wCollect();const i=STEPS.indexOf(W.step);if(i<=0){if(W.first){W.step='welcome';render()}return}W.step=STEPS[i-1];render();window.scrollTo(0,0)},
 wCancel:()=>{crReset();W=null;go('home')},
 wNumPick:el=>{W.number=el.dataset.n;if($('#wnum'))$('#wnum').value=W.number;toast('Zählernummer übernommen.')},
 wFinish:()=>wFinish(),
 reload:()=>{const go=()=>location.reload();try{navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).then(go,go)}catch(e){go()}},
 wColor:el=>{wCollect();W.col=el.dataset.c;render()},
 wStep:el=>{const f=el.dataset.f,d=+el.dataset.d,op=W.pre,od=W.dec;let np=op,nd=od;if(f==='pre')np=Math.max(1,Math.min(10,op+d));else nd=Math.max(0,Math.min(5,od+d));W.digits=reshape(W.digits,op,od,np,nd);W.pre=np;W.dec=nd;render()}
};
document.addEventListener('click',e=>{
 const rmb=e.target.closest('[data-rm]'),wdb=e.target.closest('[data-wd]');
 if(RM&&rmb){const k=rmb.dataset.rm;RM.m.has(k)?RM.m.delete(k):RM.m.add(k);rmLive();return}
 if(RM&&wdb){const k=+wdb.dataset.wd;RM.days.has(k)?RM.days.delete(k):RM.days.add(k);rmLive();return}
 const sw=e.target.closest('[data-sw]');
 if(sw&&EM){EM.col=sw.dataset.sw;$('#em-sw').innerHTML=swHtml();return}
 const el=e.target.closest('[data-act]');
 if(el&&ACT[el.dataset.act]){e.preventDefault();ACT[el.dataset.act](el,e)}
});
document.addEventListener('change',e=>{
 if(e.target.id==='rm-kind'&&RM)rmLive();
 if(e.target.id==='em-reint'&&EM){EM.reint=e.target.checked;emLive()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.matches('.rollers input')){
  t.value=t.value.replace(/\D/g,'').slice(-1);const dg=(VIEW==='setup'&&W)?W.digits:R.digits;dg[+t.dataset.i]=t.value;if(VIEW==='setup'){const o=$('#wsum');if(o)o.textContent=wSum()}
  if(t.value){const nx=t.parentElement.querySelector('input[data-i="'+(+t.dataset.i+1)+'"]');if(nx)nx.focus({preventScroll:true})}
 }else if(t.id==='rdt')R.dt=t.value;
 else if(t.id==='scan')R.scan=t.value;
 else if(t.id==='theme'){S.set.theme=t.value;save();applyTheme()}
 else if(t.id==='wscan'){W.nums=numberCandidates(t.value);const box=t.closest('details'),old=$('.chips',box);if(old)old.remove();if(W.nums.length){const c=document.createElement('div');c.className='chips';c.innerHTML=W.nums.map(n=>'<button class="chip" data-act="wNumPick" data-n="'+esc(n)+'">'+esc(n)+'</button>').join('');box.appendChild(c)}}
});
document.addEventListener('keydown',e=>{
 const t=e.target;
 if(t.matches&&t.matches('.rollers input')&&e.key==='Backspace'&&!t.value){const pv=t.parentElement.querySelector('input[data-i="'+(+t.dataset.i-1)+'"]');if(pv){pv.focus({preventScroll:true});pv.select()}}
});
function alignEntry(){
 const e=$('.entry');if(!e)return;
 const vv=window.visualViewport,off=vv?vv.offsetTop:0,vh=vv?vv.height:innerHeight;
 const safe=parseFloat(getComputedStyle(document.body).paddingTop)||0,r=e.getBoundingClientRect();
 if(r.top>=off+safe&&r.bottom<=off+vh)return;
 window.scrollBy({top:r.top-(off+safe+6),behavior:'auto'});
}
document.addEventListener('focusin',e=>{
 if(e.target.matches&&e.target.matches('.rollers input')){
  e.target.select();
  if(!document.body.classList.contains('kb')){document.body.classList.add('kb');setTimeout(alignEntry,380)}
 }
});
document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!a||!a.matches||!a.matches('.rollers input'))document.body.classList.remove('kb')},180)});
document.addEventListener('paste',e=>{
 if(e.target.matches&&e.target.matches('.rollers input')){
  const txt=(e.clipboardData||window.clipboardData).getData('text');e.preventDefault();
  if(VIEW==='setup'){const d=txt.replace(/\D/g,''),N=W.pre+W.dec;if(d.length===N){W.digits=d.split('');render()}else toast('Bitte die Stellen einzeln eintippen.');return}
  R.scan=txt;applyScan();
 }
});
$('#fcam').addEventListener('change',e=>{const el=e.target;handlePhoto(el.files[0]).finally(()=>{el.value=''})});
$('#flib').addEventListener('change',e=>{const el=e.target;handlePhoto(el.files[0]).finally(()=>{el.value=''})});
$('#fimp').addEventListener('change',e=>{importFile(e.target.files[0]);e.target.value=''});
$('#fcsv').addEventListener('change',e=>{const el=e.target;importCsv(el.files[0]).finally(()=>{el.value=''})});
window.addEventListener('resize',()=>{if(CR.src&&$('#crop')){crDraw()}});

async function checkUpdate(){
 try{
  if(!/^https?:/.test(location.protocol))return;
  const r=await fetch('index.html?u='+Date.now(),{cache:'no-store'});
  if(!r.ok)return;
  const v=parseVersion(await r.text());
  if(v&&v!==APP.version)$('#upd').hidden=false;
 }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});

/* ---------- Start ---------- */
buildTabs();applyTheme();
DB.open().then(()=>{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})});
if(!S.meters.length)startSetup(true);else render();
setTimeout(checkUpdate,1500);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
 const hadSW=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW)$('#upd').hidden=false});
 navigator.serviceWorker.register('sw.js').then(r=>{if(r&&r.update)r.update()}).catch(()=>{});
}
</script>
</body>
